name: TITONOX APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TITONOX Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk \
            release/TITONOX-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITONOX-APK
          path: release/TITONOX-debug.apk
          if-no-files-found: error
